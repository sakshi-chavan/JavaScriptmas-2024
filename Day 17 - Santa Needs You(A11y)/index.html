<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
	<title>Santa Needs You</title>
	<link rel="stylesheet" href="index.css">
</head>

<body>
    <header>
        <h1>Santa Needs You!</h1>
        <img src="santa-needs-you.png" alt="A graphic of Santa pointing towards you">
        <h2>We're recruiting elves and helpers!</h2>
    </header>
    <section>
        <form class="signup-form">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input required type="text" id="name" name="name" placeholder="Buddy JingleEyes">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input required type="email" id="email" name="email" placeholder="buddy@northpole.com">
            </div>
            <div class="form-group">
                <button type="submit">Apply Now</button>
            </div>
        </form>
        <p class="message">Email received! Thank you 🎅</p>
        <h3>"Excellent pay and conditions. Plenty of travel!"</h3>
        <footer class="footer-txt">We believe in equal opportunities. For full terms and conditions click <a href="">here</a>.</footer>
    </section>
    <script src="index.js"></script>
</body>
</html>
